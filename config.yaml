###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
l: 10
m: 8
r: 10

# -------- Avatar Model ----------------------------------------------------------
model: wav2lip                 # musetalk / wav2lip / ultralight
avatar_id: wav2lip_business_consultant_v2
batch_size: 16
wav2lip_blend_strength: 0.45 # subtle lower-face motion; upper face remains unchanged
video_watermark_text: ''     # keep the tablet presentation clean

# -------- Custom Actions ----------------------------------------------------------
customvideo_config: ''

# -------- TTS ----------------------------------------------------------
tts: edgetts                   # edgetts / gpt-sovits / cosyvoice / fishtts / tencent / doubao / indextts2 / azuretts / qwentts
REF_FILE: 'zh-CN-XiaoxiaoNeural' # mature, warm business-style female Edge TTS voice
REF_TEXT: ''                   # reference text for voice cloning (English or Chinese)
TTS_SERVER: ''                 # TTS server URL, no trailing slash

# -------- LLM ----------------------------------------------------------
llm_provider: dashscope        # dashscope / orcarouter
llm_model: qwen-turbo          # low-latency voice default; set qwen-plus for higher answer quality

# -------- Transport ----------------------------------------------------------
transport: webrtc              # rtcpush / webrtc / rtmp / virtualcam
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
max_session: 5                 # max concurrent sessions
listenport: 8010
https_port: 8443             # HTTPS port for Android tablet microphone access; 0 disables it
ssl_certfile: .certs/server.crt
ssl_keyfile: .certs/server.key
ssl_ca_certfile: .certs/local-ca.crt
